name: CI

on:
  push:
    branches: [main, dev-*]
  pull_request:
    branches: [main]

jobs:
  # ── Erlang (compile + eunit + dialyzer) ──────────────────
  erlang:
    name: Erlang Tests + Dialyzer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.18'
          rebar3-version: '3.24'

      - name: Install hex + rebar for mix
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Cache rebar3
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: erlang-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: |
            erlang-

      - name: CI gate
        run: make test dialyzer

  # ── Wire-Protocol Change Gate (SPEC-PROTO-001 policy) ───────────
  # Enforces: if a PR touches the files that define the BEAM<->C
  # wire protocol, the author MUST either (a) update/add golden
  # vectors in the sibling erlkoenigin repo, OR (b) justify the
  # exception with an explicit bypass token in the PR body.
  #
  # This codifies the lesson from the REPLY_STATUS TLV drift and
  # handshake-on-reconnect bugs: wire-protocol changes that slip
  # through without vector updates are the single highest-impact
  # regression class in this codebase.
  wire-protocol-gate:
    name: Wire-Protocol Change Gate
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect wire-protocol + vector changes
        id: detect
        run: |
          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Files changed in this PR:"
          echo "$CHANGED"
          echo
          WIRE_RE='^apps/erlkoenig/src/erlkoenig_proto\.erl$|^apps/erlkoenig/include/.*proto.*|^apps/erlkoenig/include/.*tlv.*'
          VEC_RE='^apps/erlkoenig/test/protocol_vectors/'

          if echo "$CHANGED" | grep -qE "$WIRE_RE"; then
            echo "wire_changed=true" >> "$GITHUB_OUTPUT"
            echo "Matched wire-protocol files:"
            echo "$CHANGED" | grep -E "$WIRE_RE"
          else
            echo "wire_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE "$VEC_RE"; then
            echo "vectors_changed=true" >> "$GITHUB_OUTPUT"
            echo "Matched vector files:"
            echo "$CHANGED" | grep -E "$VEC_RE"
          else
            echo "vectors_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce vector-update discipline
        if: steps.detect.outputs.wire_changed == 'true' && steps.detect.outputs.vectors_changed == 'false'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo
          echo "============================================================"
          echo "  WIRE-PROTOCOL CHANGE WITHOUT VECTOR UPDATE"
          echo "============================================================"
          echo
          echo "This PR modifies files that define the BEAM <-> C wire"
          echo "protocol but does NOT touch any vector in"
          echo "apps/erlkoenig/test/protocol_vectors/. Per SPEC-PROTO-001"
          echo "and ADR-0021, every such change MUST be paired with a"
          echo "golden-vector update."
          echo
          echo "Why: the REPLY_STATUS TLV drift and handshake-on-reconnect"
          echo "bugs were BOTH invisible because Erlang-encoder and C-parser"
          echo "drifted apart without any cross-boundary test catching it."
          echo "Golden vectors are the contract that makes drift fail loud."
          echo
          echo "What to do:"
          echo "  1. Add or update .bin + .expected.term under"
          echo "     apps/erlkoenig/test/protocol_vectors/v1/{replies,cmds}/"
          echo "     that covers the new/changed shape."
          echo "  2. (Optional, same PR) mirror the update into the"
          echo "     erlkoenigin spec repo at specs/protocol/vectors/v1/"
          echo "     for cross-reference; code-side vendor is what CI runs."
          echo "  3. Verify locally: rebar3 eunit --module=erlkoenig_proto_golden_tests"
          echo
          echo "Bypass (document-only):"
          echo "  For trivial changes that genuinely do not shift wire"
          echo "  semantics (comment-only, whitespace, pure rename) add"
          echo "  to the PR body:"
          echo
          echo "    [wire-gate: bypass <short reason>]"
          echo
          echo "  Bypasses are searchable in git log forever:"
          echo "    git log -S '[wire-gate: bypass'"
          echo
          echo "============================================================"
          echo
          # tr '\n' ' ' flattens newlines so a multi-line bypass token
          # (operator wraps a long reason across two lines) is detected.
          # grep is line-oriented by default and [^]] doesn't bridge \n.
          BODY_FLAT=$(echo "$PR_BODY" | tr '\n' ' ')
          if echo "$BODY_FLAT" | grep -qE '\[wire-gate:\s*bypass[^]]+\]'; then
            BYPASS=$(echo "$BODY_FLAT" | grep -oE '\[wire-gate:\s*bypass[^]]+\]' | head -1)
            echo "Bypass token detected: $BYPASS"
            echo "Gate passed via documented exception."
            exit 0
          fi
          echo "::error::Wire-protocol file touched without golden vector update or bypass token"
          exit 1

      - name: Gate satisfied
        if: steps.detect.outputs.wire_changed == 'false' || steps.detect.outputs.vectors_changed == 'true'
        run: |
          if [ "${{ steps.detect.outputs.wire_changed }}" = "false" ]; then
            echo "No wire-protocol files touched — gate passes trivially."
          else
            echo "Wire-protocol change paired with vector update — gate satisfied."
          fi

  # ── Protocol Golden Vectors (SPEC-PROTO-001) ─────────────────────
  # Fast, self-contained regression gate for the BEAM<->C wire
  # protocol. Runs the vendored vectors in
  # apps/erlkoenig/test/protocol_vectors/v1/ through
  # erlkoenig_proto:decode/1. Source of the vectors remains the
  # erlkoenigin spec repo; the code-repo copy is the
  # runtime-consumed artefact so CI is self-contained.
  # Deliberately separate from the main `erlang` job so the signal
  # is obvious in CI logs.
  proto-golden:
    name: Protocol Golden Vectors
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Cache rebar3
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: erlang-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: |
            erlang-

      - name: Run golden tests
        run: rebar3 eunit --module=erlkoenig_proto_golden_tests

  # ── Elixir DSL ────────────────────────────────────────────
  dsl:
    name: Elixir DSL Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.18'
          rebar3-version: '3.24'

      - name: Fetch deps
        run: cd dsl && mix deps.get

      - name: DSL tests
        run: cd dsl && mix test


  # ── nft Namespace Integration Tests ───────────────────────
  nft-integration:
    name: nft Namespace Tests
    runs-on: ubuntu-22.04
    needs: [erlang]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Cache rebar3
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: erlang-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: |
            erlang-

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.18'
          rebar3-version: '3.24'

      - name: Build DSL
        run: cd dsl && mix deps.get && mix compile

      - name: Install nft
        run: sudo apt-get update && sudo apt-get install -y nftables

      - name: Build release
        run: |
          rebar3 compile
          rebar3 release

      - name: Run nft kernel tests
        run: sudo bash tests/integration/nft-run-tests.sh tests/integration/testcases

      - name: Run nft DSL end-to-end tests
        run: |
          # DSL .exs → compile (normal user) → apply in namespace (sudo) → compare nft JSON
          ROOTDIR=$PWD/_build/default/rel/erlkoenig
          ERTS_BIN=$(ls -d $ROOTDIR/erts-*/bin | head -1)
          ESCRIPT=$PWD/tests/integration/lib/nfnl_apply.escript
          SANITIZE='
          import json, sys
          def sort_key(obj):
              order = {"metainfo": 0, "table": 1, "counter": 2, "set": 3, "map": 4,
                       "flowtable": 5, "chain": 6, "quota": 7, "rule": 8}
              for key in order:
                  if key in obj:
                      name = obj[key].get("name", obj[key].get("chain", ""))
                      return (order[key], str(name), json.dumps(obj, sort_keys=True))
              return (99, "", json.dumps(obj, sort_keys=True))
          def sanitize(data):
              items = data.get("nftables", [])
              for o in items:
                  if "metainfo" in o: o["metainfo"] = {"json_schema_version": 1}
                  for key in ("table","chain","rule","set","map","counter","quota","flowtable"):
                      if key in o and "handle" in o[key]: o[key]["handle"] = 0
              data["nftables"] = sorted(items, key=sort_key)
              return data
          data = sanitize(json.load(sys.stdin))
          json.dump(data, sys.stdout, indent=2, sort_keys=True)
          '
          PASS=0; FAIL=0; TOTAL=0
          for exs in tests/integration/testcases/**/*.exs; do
            dir=$(dirname $exs)
            base=$(basename $exs .exs)
            name="$(basename $dir)/$base"
            nft_ref="$dir/$base.nft"
            TOTAL=$((TOTAL+1))

            # Step 1: Compile .exs → .term (normal user)
            tmpterm=$(mktemp /tmp/dsl_e2e_XXXXX.term)
            abs_exs="$(pwd)/$exs"
            if ! (cd dsl && mix erlkoenig.compile "$abs_exs" -o "$tmpterm") >/dev/null 2>&1; then
              echo "  FAIL: $name (dsl compile)"
              FAIL=$((FAIL+1)); rm -f "$tmpterm"; continue
            fi

            # Step 2: Apply in namespace + get nft JSON (sudo)
            dsl_json=$(sudo unshare -n bash -c "
              $ERTS_BIN/escript $ESCRIPT $ROOTDIR $tmpterm >/dev/null 2>&1
              nft -j list ruleset
            " 2>/dev/null)
            rm -f "$tmpterm"

            # Step 3: Get reference nft JSON
            if [ ! -f "$nft_ref" ]; then
              echo "  SKIP: $name (no .nft reference)"
              continue
            fi
            ref_json=$(sudo unshare -n bash -c "
              nft -f $nft_ref 2>/dev/null
              nft -j list ruleset
            " 2>/dev/null)

            # Step 4: Sanitize + compare
            dsl_san=$(echo "$dsl_json" | python3 -c "$SANITIZE" 2>/dev/null)
            ref_san=$(echo "$ref_json" | python3 -c "$SANITIZE" 2>/dev/null)

            if [ "$dsl_san" = "$ref_san" ]; then
              echo "  PASS: $name (dsl e2e)"
              PASS=$((PASS+1))
            else
              echo "  FAIL: $name (dsl e2e DIFF)"
              FAIL=$((FAIL+1))
            fi
          done
          echo ""
          echo "$PASS/$TOTAL DSL end-to-end tests passed ($FAIL failed)"
          [ $FAIL -eq 0 ] || exit 1

  # ── Release artifacts (for pre-release testing) ───────────
  release:
    name: Release ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    needs: [erlang]
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64-linux
            runner: ubuntu-22.04
            image: hexpm/elixir:1.18.4-erlang-28.4.1-debian-bookworm-20260316-slim
            deps: apt-get update && apt-get install -y git make gcc g++ curl
          - name: x86_64-musl
            runner: ubuntu-22.04
            image: hexpm/elixir:1.18.4-erlang-28.4.1-alpine-3.21.6
            deps: apk add --no-cache git make gcc g++ musl-dev curl

    container:
      image: ${{ matrix.target.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: ${{ matrix.target.deps }}

      - name: Install rebar3
        run: |
          curl -fsSL https://s3.amazonaws.com/rebar3/rebar3 -o /usr/local/bin/rebar3
          chmod +x /usr/local/bin/rebar3

      - name: Install hex + rebar for mix
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Compile + release
        run: |
          rebar3 compile
          make release

      - name: Collect artifact
        run: |
          mkdir -p out
          cp dist/erlkoenig-*.tar.gz out/erlkoenig-${{ matrix.target.name }}.tar.gz
          ls -lh out/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target.name }}
          path: out/*.tar.gz
